<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard | Groups</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="dashboard-page">
<div class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">PG</div>
        <div><strong>PhishGuard</strong><small>Admin Console</small></div>
    </div>
    <nav>
        <a href="/admin/dashboard" class="nav-item">Dashboard</a>
        <a href="/admin/campaigns" class="nav-item">Campaigns</a>
        <a href="/admin/templates" class="nav-item">Templates</a>
        <a href="/admin/users" class="nav-item">Users</a>
        <a href="/admin/groups" class="nav-item active">Groups</a>
        <a href="/admin/departments" class="nav-item">Departments</a>
        <a href="/admin/reports" class="nav-item">Reports</a>
    </nav>
    <button id="logoutButton" class="logout-button" type="button">Logout</button>
</div>

<main class="main-content">
    <header class="topbar">
        <div>
            <h1>Target Groups</h1>
            <p>Create groups for campaign targeting.</p>
        </div>
        <button id="newGroupButton" class="primary-action-button" type="button">+ New Group</button>
    </header>

    <section class="dashboard-panel campaigns-panel">
        <div class="table-wrapper">
            <table>
                <thead>
                <tr><th>Group</th><th>Department</th><th>Members</th></tr>
                </thead>
                <tbody id="groupTable">
                <tr><td colspan="3">Loading groups...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div
    id="groupModal"
    class="modal-overlay hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="groupModalTitle"
>
    <div class="modal-card">
        <div class="modal-header">
            <div>
                <h2 id="groupModalTitle">Create Group</h2>
                <p>Select employees for the target group.</p>
            </div>
            <button id="closeGroupModal" class="modal-close" type="button" aria-label="Close group dialog">
                &times;
            </button>
        </div>

        <form id="groupForm">
            <div class="form-group">
                <label for="groupName">Group Name</label>
                <input id="groupName" type="text" required>
            </div>
            <div class="form-group">
                <label for="groupDepartment">Department</label>
                <select id="groupDepartment">
                    <option value="">No department</option>
                </select>
            </div>
            <fieldset class="selection-group">
                <legend>Members</legend>
                <div id="groupUserList" class="selection-box">Loading users...</div>
            </fieldset>

            <div id="groupError" class="error-message" role="alert" aria-live="polite"></div>
            <div class="modal-actions">
                <button id="cancelGroupButton" type="button" class="secondary-button">Cancel</button>
                <button id="saveGroupButton" type="submit" class="primary-action-button">Create Group</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/admin_api.js"></script>
<script src="/static/js/groups.js"></script>
</body>
</html>
