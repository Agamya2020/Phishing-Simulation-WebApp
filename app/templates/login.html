<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard | Admin Login</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="login-page">
<div class="login-wrapper">
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">PG</div>
            <div>
                <h1>PhishGuard</h1>
                <p>Security Awareness Platform</p>
            </div>
        </div>

        <div class="login-heading">
            <h2>Administrator Login</h2>
            <p>Sign in to manage phishing simulation campaigns.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" required>
            </div>

            <div id="loginError" class="error-message" role="alert" aria-live="polite"></div>

            <button id="loginButton" class="primary-button" type="submit">
                Sign In
            </button>
        </form>

        <div class="login-footer">Authorized administrators only.</div>
    </div>
</div>

<script src="/static/js/auth.js"></script>
</body>
</html>
